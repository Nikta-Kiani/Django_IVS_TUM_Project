{% extends 'base.html' %}

{% block title %}Welcome to IVS Site Administration/Registeration{% endblock %}

{% block content %}
    <h1>Registeration</h1>
    
    <form method="post" action="{% url 'registeration' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endblock %}
