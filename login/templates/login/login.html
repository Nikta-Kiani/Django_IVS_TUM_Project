{% load static %}

<!DOCTYPE html>
<html lang="en">
{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <header></header>

    <!-- Main Tabs for Welcome Page -->
    <div class="tab" data-group="main">
        <button class="tablinks" onclick="location.href='{% url 'registeration' %}'">Registeration</button>
        <button class="tablinks" onclick="location.href='{% url 'login' %}'">Login</button>
        <button class="tablinks" onclick="location.href='{% url 'antenna' %}'">Antenna</button>
        <button class="tablinks" onclick="location.href='{% url 'configuration' %}'">Configuration</button>
        <button class="tablinks" onclick="location.href='{% url 'logbook' %}'">Logbook</button>
        <button class="tablinks" onclick="location.href='{% url 'summary' %}'">Summary</button>
        <button class="tablinks" onclick="location.href='{% url 'impressum' %}'">Impressum</button>
        
    <!-- Login Tab Content -->
<div id="Login" class="tabcontent" data-group="main">
    <h1>Login</h1>
    <form method="POST" action="{% url 'login' %}">
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required><br>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
{% endblock %}
